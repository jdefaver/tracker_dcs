# for the 9 SCD sensors, make our life simpler using a template
# topics are e.g. 'ESP04/sensors/RTD/CHAN1/temp'
[[processors.rename]]
  namepass = ["sensors"]
  [[processors.rename.replace]]
    field = "value"
    dest = "RTD_temp"
  [processors.rename.tagpass]
    topic = ["*/*/RTD/*/temp"]
# set new "channel" tag based on topic
[[processors.regex]]
  namepass = ["sensors"]
  [[processors.regex.tags]]
    key = "topic"
    pattern = "^ESP04/sensors/RTD/(?P<channel>.*?)/temp$"
    replacement = "${channel}"
    result_key = "channel" 
  [processors.regex.tagpass]
    sensor = ["ESP04"]
  

[[aggregators.merge]]
  namepass = ["sensors"] # only pass sensor metric through aggregator
  drop_original = true
