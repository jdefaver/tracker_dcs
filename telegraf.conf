[global_tags]
[agent]
  debug = false
  quiet = false

[[outputs.influxdb]]
    database = "trackerdcs"
    urls = ["http://localhost:8086"]
    ## avoid letting telegraf create the influxdb database
    skip_database_creation = true

## Security

[[inputs.mqtt_consumer]]
    alias = "mqtt_dss"
    servers = ["tcp://localhost:1883"]
    topics = ["dss/status"]
    name_override = "dss_status"
    # all fields will be strings
    json_string_fields = ["*"]
    data_format = "json"

## CAEN

[[inputs.mqtt_consumer]]
  alias = "mqtt_caen_dcs"

  ## MQTT broker URLs to be used. The format should be scheme://host:port,
  ## schema can be tcp, ssl, or ws.
  servers = ["tcp://localhost:1883"]

  ## Topics that will be subscribed to.
  topics = ["dcs/status"]
  name_override = "dcs_status"
  json_string_fields = ["fsm_state"]
  data_format = "json"

[[inputs.mqtt_consumer]]
  alias = "mqtt_caen_channels"
  servers = ["tcp://localhost:1883"]
  topics = ["dcs/channels"]
  name_override = "channels"
  tag_keys = ["id", "module", "lv_board", "lv_channel", "hv_board", "hv_channel"]
  json_string_fields = ["fsm_state", "module"]
  data_format = "json"

[[processors.converter]]
  namepass = ["channels"]
  [processors.converter.fields]
    integer = ["lv_tripInt", "lv_tripExt", "lv_status", "hv_tripInt", "hv_tripExt", "hv_status", "hv_imRange", "hv_tripMode"]


## Chiller

[[inputs.mqtt_consumer]]
  alias = "mqtt_julabo_dcs"
  servers = ["tcp://localhost:1883"]
  topics = ["julabo/status"]
  name_override = "chiller"
  json_string_fields = ["fsm_state"]
  data_format = "json"

[[processors.converter]]
  namepass = ["chiller"]
  [processors.converter.fields]
    unsigned = ["status_code", "used_setpoint"]

## MARTA

[[inputs.mqtt_consumer]]
  alias = "mqtt_MARTA_dcs"
  servers = ["tcp://localhost:1883"]
  topics = ["MARTA/status"]
  name_override = "MARTA"
  json_string_fields = ["fsm_state"]
  data_format = "json"

[[processors.converter]]
  namepass = ["MARTA"]
  [processors.converter.fields]
    unsigned = ["status", "set_start_chiller", "set_start_co2", "set_flow_active", "set_alarm_reset"]

## Cold box M5 multi-sensors

[[inputs.mqtt_consumer]]
  alias = "mqtt_coldbox"
  servers = ["tcp://localhost:1883"]
  topics = ["M504/sensors/#"]
  name_override = "sensors"  # this will be the measurement name in influxDB
  data_format = "json"
  data_type = "float"

[[inputs.mqtt_consumer]]
  alias = "mqtt_coldbox"
  servers = ["tcp://localhost:1883"]
  topics = ["M505/sensors/#"]
  name_override = "sensors"  # this will be the measurement name in influxDB
  data_format = "json"
  data_type = "float"

## Disco sensors

[[inputs.mqtt_consumer]]
  alias = "mqtt_disco"
  servers = ["tcp://localhost:1883"]
  topics = ["ESP01/sensors/#", "ESP02/sensors/#", "ESP03/sensors/#", "ESP04/sensors/#", "ESP05/sensors/#", "M501/sensors/#", "M502/sensors/#", "M503/sensors/#"]
  name_override = "sensors"  # this will be the measurement name in influxDB
  data_format = "value"
  data_type = "float"

# Insert tag with sensor name
# -> one item per Disco!

[[processors.override]]
